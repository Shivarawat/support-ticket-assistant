spring.application.name=support-ticket-assistant

# Database connection (Postgres in Docker: container ticket-postgres)
spring.datasource.url=jdbc:postgresql://localhost:5433/tickets
spring.datasource.username=ticket
spring.datasource.password=ticket

# Hibernate creates/updates tables to match the @Entity classes
spring.jpa.hibernate.ddl-auto=update
# Print the SQL Hibernate generates (for learning)
spring.jpa.show-sql=true
